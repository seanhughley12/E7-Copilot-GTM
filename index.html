<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<title>E7 &amp; Copilot GTM · Sean Hughley</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0a2540;--navy-deep:#061a30;--blue:#0078d4;--blue-soft:#e9f3fc;--cyan:#50e6ff;--gold:#e0a53a;--purple:#5c2d91;
  --ink:#15202e;--muted:#5d6b80;--border:#e3e9f1;--surface:#fff;--bg:#f3f7fb;
  --green:#1a9c5b;--amber:#e0962a;--red:#d1472c;
  --radius:14px;--shadow:0 2px 14px rgba(10,37,64,.07);--shadow-lg:0 14px 44px rgba(10,37,64,.15);
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.top{position:sticky;top:0;z-index:50;background:rgba(10,37,64,.98);backdrop-filter:blur(10px);color:#fff;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 18px rgba(0,0,0,.2)}
.top-brand{display:flex;align-items:center;gap:13px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px}
.top-brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--navy)}
.top-right{display:flex;align-items:center;gap:14px;font-size:12.5px;color:rgba(255,255,255,.65)}
.qfilter{display:flex;align-items:center;gap:8px}
.qfilter select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
.qfilter select option{color:#15202e}
.badge{background:var(--gold);color:var(--navy);font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.5px}
.wrap{max-width:1240px;margin:0 auto;padding:40px}
.page-eyebrow{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.page-head h1{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;letter-spacing:-1px;color:var(--navy)}
.section-title{font-family:'Space Grotesk',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:700;margin:38px 0 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.section-title .hint{font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500}
.exec{background:linear-gradient(135deg,var(--navy),#123a63);color:#fff;border-radius:18px;padding:30px 36px;box-shadow:var(--shadow-lg);margin-top:18px}
.exec-kick{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.exec h2{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:600;line-height:1.4;max-width:80ch}
.exec p{font-size:14px;color:rgba(255,255,255,.82);margin-top:10px;max-width:92ch}
.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.insight{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:14px 16px}
.insight .ic{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
.insight p{font-size:13px;color:#fff;margin:0;line-height:1.45}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.track{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.track.allup{grid-column:1 / -1;background:linear-gradient(135deg,#0d2d4e,#17507f);color:#fff;border-color:transparent}
.track-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.track-name{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}
.track.allup .track-name{color:#fff}
.track-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px}
.tag-e7{background:rgba(0,120,212,.14);color:var(--blue)}
.tag-cp{background:rgba(92,45,145,.14);color:var(--purple)}
.tag-all{background:rgba(255,255,255,.18);color:#fff}
.track-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcell .tl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
.track.allup .tcell .tl{color:rgba(255,255,255,.7)}
.tcell .tv{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;color:var(--navy);margin-top:4px}
.track.allup .tcell .tv{color:#fff}
.tcell .tv.togo{color:var(--red)}
.track.allup .tcell .tv.togo{color:var(--cyan)}
.progress{height:9px;border-radius:999px;background:var(--border);margin-top:16px;overflow:hidden}
.track.allup .progress{background:rgba(255,255,255,.18)}
.progress>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.pct-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px;font-weight:600}
.track.allup .pct-row{color:rgba(255,255,255,.8)}
.cover-note{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px dashed var(--border);padding-top:10px}
.seats-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.seat-card{border-radius:16px;padding:26px 30px}
.seat-card.hipo{background:linear-gradient(120deg,var(--navy-deep),var(--blue));color:#fff;box-shadow:var(--shadow-lg)}
.seat-card.upside{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.seat-kick{font-size:11.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.seat-card.hipo .seat-kick{color:var(--cyan)}
.seat-card.upside .seat-kick{color:var(--muted)}
.seat-num{font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.seat-card.upside .seat-num{color:var(--navy)}
.seat-desc{font-size:13px;margin-top:10px}
.seat-card.hipo .seat-desc{color:rgba(255,255,255,.82)}
.seat-card.upside .seat-desc{color:var(--muted)}
.seat-split{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.seat-split div{font-size:12.5px;color:var(--muted)}
.seat-split b{display:block;font-family:'Space Grotesk',sans-serif;font-size:19px;color:var(--navy);font-weight:700}
.hipo{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hipo-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.hipo-col h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.hipo-col .hc-sum{font-size:12.5px;color:var(--muted);margin-bottom:14px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%}
.dot.high{background:var(--green)}.dot.med{background:var(--amber)}.dot.low{background:var(--muted)}
.hipo-chip{display:block;padding:12px 14px;border:1px solid var(--border);border-left:4px solid var(--brand,var(--blue));border-radius:10px;margin-bottom:10px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.hipo-chip:hover{transform:translateX(2px);box-shadow:var(--shadow)}
.hipo-chip .hc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hipo-chip .hc-name{font-weight:700;font-size:14px;color:var(--navy)}
.hipo-chip .hc-val{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--navy)}
.hipo-chip .hc-meta{font-size:12px;color:var(--muted);margin-top:3px}
.deals{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.deals table{width:100%;border-collapse:collapse}
.deals th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;padding:14px 16px;border-bottom:2px solid var(--border);background:var(--bg)}
.deals td{padding:13px 16px;font-size:13.5px;vertical-align:middle}
.deal-main td{border-bottom:none;padding-bottom:5px}
.deal-name{font-weight:600;color:var(--navy)}
.deal-sub{font-size:12px;color:var(--muted)}
.num{font-family:'Space Grotesk',sans-serif;font-weight:600;text-align:right;white-space:nowrap}
.num-sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.flag{color:var(--amber);font-weight:700;cursor:help}
.prob-pill{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:3px 9px;border-radius:999px}
.prob-high{background:rgba(26,156,91,.14);color:var(--green)}
.prob-med{background:rgba(224,150,42,.16);color:var(--amber)}
.prob-low{background:#eef2f7;color:var(--muted)}
.links{display:flex;gap:8px;white-space:nowrap}
.lnk{font-size:12px;font-weight:700;text-decoration:none;padding:6px 11px;border-radius:8px;border:1px solid var(--border)}
.lnk.strat{color:var(--blue);border-color:rgba(0,120,212,.3)}
.lnk.strat:hover{background:var(--blue-soft)}
.lnk.crm{color:var(--muted)}
.lnk.crm:hover{background:var(--bg)}
.lnk.off{opacity:.4;pointer-events:none}
.deal-comment td{padding:0 16px 13px 16px;font-size:12.5px;color:var(--muted);line-height:1.5;border-bottom:1px solid var(--border)}
.cmt-lbl{font-weight:800;color:var(--navy);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;margin-right:6px}
.deal-total td{font-weight:700;border-top:2px solid var(--border);border-bottom:none}
.hours{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow)}
.hbar-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.hbar-row:last-child{margin-bottom:0}
.hbar-name{width:140px;font-size:13.5px;font-weight:600;color:var(--navy);flex-shrink:0}
.hbar-track{flex:1;background:var(--bg);border-radius:8px;height:26px;overflow:hidden}
.hbar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-size:11.5px;font-weight:700;min-width:36px}
.foot{color:var(--muted);font-size:12.5px;margin-top:40px;line-height:1.6;border-top:1px solid var(--border);padding-top:18px}
.wa{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px}
.wa-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.wa-kick{font-size:11.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.wa-big{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;color:var(--navy);line-height:1.1;margin-top:4px}
.wa-sub{font-size:13px;color:var(--muted);margin-top:6px;max-width:80ch}
.wa-table{width:100%;border-collapse:collapse;margin-top:4px}
.wa-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--border)}
.wa-table td{padding:12px;border-bottom:1px solid var(--border);font-size:13.5px}
.wa-table tr:last-child td{border-bottom:none}
.pct-over{background:rgba(26,156,91,.14);color:var(--green);font-weight:800;padding:2px 8px;border-radius:999px;font-size:12.5px}
.pct-near{background:rgba(224,150,42,.16);color:var(--amber);font-weight:800;padding:2px 8px;border-radius:999px;font-size:12.5px}
.pct-under{background:#eef2f7;color:var(--muted);font-weight:800;padding:2px 8px;border-radius:999px;font-size:12.5px}
.wa-note{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px dashed var(--border);padding-top:12px;line-height:1.5}
@media(max-width:900px){.tracks,.seats-row,.insights,.hipo{grid-template-columns:1fr}.wrap{padding:24px}.seat-num{font-size:40px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

const SELLER = 'Sean Hughley';
const FY = 'FY27';
const COPILOT_FACTOR = 0.56;
/* Comp plan weights per earning bucket (fraction of plan). null until Sean confirms
   from his MSX incentive view. When set, a single weighted-attainment % is computed. */
const COMP_WEIGHTS = { aiw: null, cpa: null };

const TRACKS = {
  e7:     { name: 'E7 / M365 Suite', tag: 'tag-e7', target: 8778078,  actual: 6891,    scheduled: 4141908, togo: 4629280, upside: 4912344 },
  copilot:{ name: 'M365 Copilot',    tag: 'tag-cp', target: 6789546,  actual: 2693312, scheduled: 1110674, togo: 2985560, upside: 1358647 },
  allup:  { name: 'AI Workforce (all-up)', tag: 'tag-all', target: 15567624, actual: 2700203, scheduled: 5252581, togo: 7614840, upside: 6270990 },
};

const CRM = (guid) => `https://microsoftsales.crm.dynamics.com/main.aspx?pagetype=entityrecord&etn=opportunity&id=${guid}`;
const STRAT = {
  autoliv: 'https://seanhughley12.github.io/Autoliv.Harley.Smiths.Echo/autoliv/',
  harley: 'https://seanhughley12.github.io/Autoliv.Harley.Smiths.Echo/',
  smiths: 'https://seanhughley12.github.io/Autoliv.Harley.Smiths.Echo/',
  echo: 'https://seanhughley12.github.io/Autoliv.Harley.Smiths.Echo/',
  msc: 'https://seanhughley12.github.io/MSC/',
  chrobinson: 'https://seanhughley12.github.io/CHR.Polaris.Sriva/',
};

const deals = [
  { name: 'MSC · 73K Seats, The AI Platform', acct: 'msc', brand: '#13477e', guid: '65aaeb01-1c76-f111-ab0f-7ced8dda43b8',
    billed: 4412101, bm: 6, monthly: 735350, fyMonths: 6, confirm: false, seats: 62021, close: 'Jan 20', prob: 'med',
    comment: 'Sept 25 E7/Agent 365 discussion with MSC security and IT. Centralized agent-governance need validated and tied to FinOps and cost predictability. Use the October Geneva engagement to quantify the E7 path. Anniversary is July 1, so only the 6 co-term months retire in FY27; the renewal retires next fiscal.' },
  { name: 'CH Robinson · 12,020 Seats', acct: 'chrobinson', brand: '#0a7d3a', guid: '3cc8156b-1d76-f111-ab0f-7ced8dda43b8',
    billed: 2307840, bm: 12, monthly: 192320, fyMonths: 12, confirm: true, seats: 12020, close: 'Mar 18', prob: 'low',
    comment: 'On 9/17 pitched E7 at $16/user vs ~$30 today across ~1,000 Copilot licenses. CTO Mike Neill and Terry Bigaouette did not reject; asked if $16 is volume-contingent on 80%+ coverage. Next: lock the volume construct. Risk: CHR DIY control plane may blunt urgency.' },
  { name: 'Autoliv · E7 Step-up (Anniversary)', acct: 'autoliv', brand: '#005495', guid: '512dda65-c773-f111-ab0f-000d3a162e2d',
    billed: 1374504, bm: 4, monthly: 343626, fyMonths: 16, confirm: false, seats: 18080, close: 'Dec 1', prob: 'high',
    comment: '9/25: interest confirmed but no support yet for 80% coverage; customer building a lower-commitment counter-proposal. Bob Hale pulled the step-up from technical eval into a commercial offer with Ina Epure and Ciprian David. Anniversary April 2027 is in FY27, so all 16 months (4 co-term + 12 renewal) retire this year.' },
  { name: 'W2W E7 Step-up (Sirva)', acct: null, brand: '#5a6b80', guid: '65ab5020-74a8-f111-b8de-000d3a8cec07',
    billed: 1000320, bm: 12, monthly: 83360, fyMonths: 12, confirm: true, seats: 4168, close: 'Apr 1', prob: 'low',
    comment: 'Sirva. Invites finalized: AI/Agentic Discovery 10/5, Executive Presentation 11/2; pivoting to the Frontier Firm story. Governance and security work with Mike Garza underway. Early stage, low win prob; Sirva headwinds could stall.' },
  { name: 'Smiths · E7 Step-up (Mid-term)', acct: 'smiths', brand: '#0a2540', guid: 'fa5f22c1-9674-f111-ab0f-000d3a162e2d',
    billed: 761319, bm: 6, monthly: 126887, fyMonths: 6, confirm: true, seats: 12050, close: 'Jan 1', prob: 'low',
    comment: 'No E7 step-up motion this window; 9/21 Connect scoped to divestitures and the July 2027 EA renewal. 9/9 approved a limited Copilot Cowork POC. Mid-term credit trues up at the July 2027 anniversary, so only the co-term months count in FY27.' },
  { name: 'Echo Global · E7 Step-up (Anniversary)', acct: 'echo', brand: '#00843d', guid: '46ab0baa-d773-f111-ab0f-000d3a162e2d',
    billed: 510747, bm: 12, monthly: 42562, fyMonths: 12, confirm: true, seats: 4042, close: 'Apr 1', prob: 'low',
    comment: 'Little E7 activity; Echo focused on the Fastmore/ITS/RoadTex tenant consolidation ahead of the Oct 1 echo.com cutover. October Business Review scheduled with an Entra Suite buying discussion. Fiscal timing needs confirmation (Apr 1 close vs Apr 2028 anniversary).' },
  { name: 'Harley-Davidson · E7 Step-up (Renewal)', acct: 'harley', brand: '#f6861f', guid: '4ef033e2-d873-f111-ab0f-000d3a162e2d',
    billed: 342000, bm: 12, monthly: 28500, fyMonths: 12, confirm: true, seats: 6000, close: 'May 1', prob: 'low',
    comment: '9/21 Agent Capability Deep Dive for a full Harley bench; strong governance engagement (Agent 365 as control plane, Purview/E5 tie-in) but hard pushback on cost. Chad Aron challenged token/API economics, Justin Knauer flagged no spend cap on PAYG.' },
];

const hours = [
  { name: 'MSC', n: 54 }, { name: 'Autoliv', n: 35 }, { name: 'CH Robinson', n: 20 },
  { name: 'Harley', n: 14 }, { name: 'Smiths', n: 10 }, { name: 'Echo', n: 2 },
];

const fmt = (n) => n >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'M' : '$' + Math.round(n / 1e3) + 'K';
const fmtK = (n) => n.toLocaleString();
const fyForecast = (d) => Math.round(d.monthly * d.fyMonths);
const pctCls = (r) => r >= 1 ? 'pct-over' : (r >= 0.8 ? 'pct-near' : 'pct-under');

function Track({ t, cover }) {
  const attained = t.actual + t.scheduled;
  const pct = Math.round((attained / t.target) * 100);
  const isAll = t.tag === 'tag-all';
  return (
    <div className={`track ${isAll ? 'allup' : ''}`}>
      <div className="track-head">
        <span className="track-name">{t.name}</span>
        <span className={`track-tag ${t.tag}`}>{isAll ? 'Combined' : 'Quota'}</span>
      </div>
      <div className="track-grid">
        <div className="tcell"><div className="tl">Target</div><div className="tv">{fmt(t.target)}</div></div>
        <div className="tcell"><div className="tl">Actuals + Scheduled</div><div className="tv">{fmt(attained)}</div></div>
        <div className="tcell"><div className="tl">Target To Go</div><div className="tv togo">{fmt(t.togo)}</div></div>
      </div>
      <div className="progress"><span style={{ width: Math.min(100, pct) + '%' }} /></div>
      <div className="pct-row"><span>{pct}% attained</span><span>{fmt(t.togo)} to go</span></div>
      {cover != null && <div className="cover-note">Open pipeline forecast toward this quota: <b>{fmt(cover)}</b> ({(cover / t.togo).toFixed(1)}x the gap). Upside pipeline {fmt(t.upside)}.</div>}
    </div>
  );
}

function App() {
  const [q, setQ] = useState('FY');
  const probMeta = { high: ['HiPo', 'prob-high', 'dot high'], med: ['Medium', 'prob-med', 'dot med'], low: ['Low', 'prob-low', 'dot low'] };
  const byProb = (p) => deals.filter((d) => d.prob === p);
  const maxHours = Math.max.apply(null, hours.map((h) => h.n));

  const fcTotal = deals.reduce((t, d) => t + fyForecast(d), 0);
  const coverE7 = fcTotal;
  const coverCp = Math.round(fcTotal * COPILOT_FACTOR);

  // Weighted attainment / comp buckets. Each open deal's quota revenue retires
  // 100% into AI Workforce and 56% into Copilot & Agents (plus other buckets TBD).
  const fcBy = (p) => deals.filter((d) => d.prob === p).reduce((t, d) => t + fyForecast(d), 0);
  const fcHiPo = fcBy('high');
  const fcMed = fcBy('med');
  const BUCKETS = [
    { key: 'aiw', name: 'AI Workforce', factor: 1.00, target: TRACKS.allup.target, attained: TRACKS.allup.actual + TRACKS.allup.scheduled, weight: COMP_WEIGHTS.aiw },
    { key: 'cpa', name: 'Copilot & Agents', factor: COPILOT_FACTOR, target: TRACKS.copilot.target, attained: TRACKS.copilot.actual + TRACKS.copilot.scheduled, weight: COMP_WEIGHTS.cpa },
  ];
  const bucketRows = BUCKETS.map((b) => {
    const now = b.attained / b.target;
    const withHiPo = (b.attained + fcHiPo * b.factor) / b.target;
    const withMed = (b.attained + (fcHiPo + fcMed) * b.factor) / b.target;
    const withAll = (b.attained + fcTotal * b.factor) / b.target;
    return { ...b, now, withHiPo, withMed, withAll };
  });
  const weightsSet = BUCKETS.every((b) => b.weight != null);
  const weighted = (sel) => weightsSet ? bucketRows.reduce((t, b) => t + b.weight * b[sel], 0) : null;

  const seatsHiPo = deals.filter((d) => d.prob === 'high').reduce((t, d) => t + d.seats, 0);
  const seatsMed = deals.filter((d) => d.prob === 'med').reduce((t, d) => t + d.seats, 0);
  const seatsLow = deals.filter((d) => d.prob === 'low').reduce((t, d) => t + d.seats, 0);
  const seatsUpside = seatsMed + seatsLow;

  const DealLinks = ({ d }) => (
    <div className="links">
      <a className={`lnk strat ${d.acct && STRAT[d.acct] ? '' : 'off'}`} href={d.acct ? STRAT[d.acct] : '#'} target="_blank" rel="noreferrer">Strategy →</a>
      <a className="lnk crm" href={CRM(d.guid)} target="_blank" rel="noreferrer">CRM ↗</a>
    </div>
  );

  return (
    <>
      <div className="top">
        <div className="top-brand"><span className="mark">E7</span> E7 &amp; Copilot · GTM</div>
        <div className="top-right">
          <div className="qfilter"><span>View</span>
            <select value={q} onChange={(e) => setQ(e.target.value)}>
              <option value="FY">Full Year</option>
              <option value="Q1">Q1</option><option value="Q2">Q2</option>
              <option value="Q3">Q3</option><option value="Q4">Q4</option>
            </select>
          </div>
          <span>{SELLER} · {FY}</span><span className="badge">INTERNAL</span>
        </div>
      </div>
      <div className="wrap">
        <div className="page-head">
          <div className="page-eyebrow">Go-to-Market Rollup · {FY}{q !== 'FY' ? ' · ' + q : ''}</div>
          <h1>E7 &amp; Copilot Patch</h1>
        </div>

        <div className="exec">
          <div className="exec-kick">Patch Strategy</div>
          <h2>Coverage exists, conviction does not. $7.6M to go against a combined $15.6M target, with $14.8M of open forecast behind it, but only Autoliv carries HiPo conviction today. The half is won by converting upside into commit, not by sourcing more pipeline.</h2>
          <p>The shared blocker across MSC, CH Robinson, and Harley is cost and consumption economics, not product fit. The unlock is a single FinOps plus Agent 365 governance proof that makes E7 spend predictable. Land that, and the medium and low deals move to commit together.</p>
          <div className="insights">
            <div className="insight"><div className="ic">The number</div><p>$7.6M to go, $14.8M open forecast. Coverage is 1.9x, but HiPo is a single deal. Concentration is the risk.</p></div>
            <div className="insight"><div className="ic">The shared unlock</div><p>Cost predictability blocks MSC, CHR, and Harley. One FinOps plus Agent 365 governance proof clears all three.</p></div>
            <div className="insight"><div className="ic">The seat story</div><p>118K net-new Copilot seats in play. 85% sits in upside, not commit. Converting upside seats is the growth motion.</p></div>
          </div>
        </div>

        <div className="section-title">Quota Attainment <span className="hint">E7 and Copilot tracked separately. An E7 deal retires 100% of E7 quota and 56% of Copilot quota.</span></div>
        <div className="tracks">
          <Track t={TRACKS.allup} cover={null} />
          <Track t={TRACKS.e7} cover={coverE7} />
          <Track t={TRACKS.copilot} cover={coverCp} />
        </div>

        <div className="section-title">Weighted Attainment · Comp View <span className="hint">one E7 deal retires multiple buckets. Entire revenue, not just forecast.</span></div>
        <div className="wa">
          <div className="wa-head">
            <div>
              <div className="wa-kick">Weighted attainment</div>
              <div className="wa-big">{weightsSet ? Math.round(weighted('now') * 100) + '%' : 'Set plan weights'}</div>
              <div className="wa-sub">{weightsSet ? 'Blended across buckets at plan weights. Projected ' + Math.round(weighted('withHiPo') * 100) + '% with HiPo, ' + Math.round(weighted('withAll') * 100) + '% if all open lands.' : 'Enter each bucket plan weight (from the MSX incentive view) to compute a single blended weighted-attainment number and the over-100% upside.'}</div>
            </div>
          </div>
          <table className="wa-table">
            <thead><tr><th>Earning bucket</th><th>E7 retires</th><th style={{ textAlign: 'right' }}>Target</th><th style={{ textAlign: 'right' }}>Now</th><th style={{ textAlign: 'right' }}>+ HiPo</th><th style={{ textAlign: 'right' }}>+ HiPo &amp; Med</th><th style={{ textAlign: 'right' }}>If all land</th><th style={{ textAlign: 'right' }}>Weight</th></tr></thead>
            <tbody>
              {bucketRows.map((b) => (
                <tr key={b.key}>
                  <td className="deal-name">{b.name}</td>
                  <td>{Math.round(b.factor * 100)}%</td>
                  <td className="num">{fmt(b.target)}</td>
                  <td className="num"><span className={pctCls(b.now)}>{Math.round(b.now * 100)}%</span></td>
                  <td className="num"><span className={pctCls(b.withHiPo)}>{Math.round(b.withHiPo * 100)}%</span></td>
                  <td className="num"><span className={pctCls(b.withMed)}>{Math.round(b.withMed * 100)}%</span></td>
                  <td className="num"><span className={pctCls(b.withAll)}>{Math.round(b.withAll * 100)}%</span></td>
                  <td className="num">{b.weight != null ? Math.round(b.weight * 100) + '%' : <span className="flag" title="Enter plan weight">⚑</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="wa-note">Each open deal's entire FY27 revenue retires 100% of AI Workforce and 56% of Copilot &amp; Agents, so the same deal lifts both buckets. Autoliv alone (HiPo) takes Copilot &amp; Agents to {Math.round(bucketRows[1].withHiPo * 100)}% and AI Workforce to {Math.round(bucketRows[0].withHiPo * 100)}%. Other buckets an E7 deal may retire (Security, E5) are not yet modeled. Confirm the bucket list, targets, retirement rates, and weights from the MSX incentive view.</div>
        </div>

        <div className="section-title">Net-New Copilot Seats <span className="hint">Copilot-inclusive E7 seats. HiPo commit vs. upside white space.</span></div>
        <div className="seats-row">
          <div className="seat-card hipo">
            <div className="seat-kick">HiPo · committed path</div>
            <div className="seat-num">{fmtK(seatsHiPo)}</div>
            <div className="seat-desc">Net-new Copilot seats in HiPo deals (Autoliv). The seats we have conviction on this half.</div>
          </div>
          <div className="seat-card upside">
            <div className="seat-kick">Upside · white space we are going after</div>
            <div className="seat-num">{fmtK(seatsUpside)}</div>
            <div className="seat-desc">Net-new Copilot seats in Medium and Low deals. The growth target is converting these to commit.</div>
            <div className="seat-split">
              <div>Medium<b>{fmtK(seatsMed)}</b>MSC</div>
              <div>Low<b>{fmtK(seatsLow)}</b>CHR, Smiths, Harley, Echo, Sirva</div>
            </div>
          </div>
        </div>

        <div className="section-title">HiPo View <span className="hint">deals by win probability, read from CRM forecast comments</span></div>
        <div className="hipo">
          {['high', 'med', 'low'].map((p) => {
            const list = byProb(p);
            const sum = list.reduce((t, d) => t + fyForecast(d), 0);
            return (
              <div className="hipo-col" key={p}>
                <h3><span className={probMeta[p][2]} /> {probMeta[p][0]}</h3>
                <div className="hc-sum">{list.length} deals · {fmt(sum)} forecast</div>
                {list.map((d, i) => (
                  <a className="hipo-chip" style={{ '--brand': d.brand }} key={i} href={d.acct && STRAT[d.acct] ? STRAT[d.acct] : CRM(d.guid)} target="_blank" rel="noreferrer">
                    <div className="hc-top"><span className="hc-name">{d.name.split(' · ')[0]}</span><span className="hc-val">{fmt(fyForecast(d))}</span></div>
                    <div className="hc-meta">{fmtK(d.seats)} seats · closes {d.close}</div>
                  </a>
                ))}
                {!list.length && <div className="hc-meta">None.</div>}
              </div>
            );
          })}
        </div>

        <div className="section-title">Deals That Decide <span className="hint">FY27 forecast (in-year billed ≈ quota) · latest CRM comment · click to strategy or CRM</span></div>
        <div className="deals">
          <table>
            <thead><tr><th>Deal</th><th>Prob</th><th style={{ textAlign: 'right' }}>FY27 Forecast</th><th style={{ textAlign: 'right' }}>Net-new Seats</th><th>Close</th><th>Links</th></tr></thead>
            <tbody>
              {deals.map((d, i) => (
                <React.Fragment key={i}>
                  <tr className="deal-main">
                    <td><div className="deal-name">{d.name.split(' · ')[0]}</div><div className="deal-sub">{d.name.indexOf(' · ') >= 0 ? d.name.split(' · ')[1] : ''}</div></td>
                    <td><span className={`prob-pill ${probMeta[d.prob][1]}`}>{probMeta[d.prob][0]}</span></td>
                    <td className="num">{fmt(fyForecast(d))} {d.confirm && <span className="flag" title="Fiscal timing inferred, confirm with Sean">⚑</span>}<div className="num-sub">{d.fyMonths} mo in FY · {fmt(d.billed)} billed co-term</div></td>
                    <td className="num">{fmtK(d.seats)}</td>
                    <td>{d.close}</td>
                    <td><DealLinks d={d} /></td>
                  </tr>
                  <tr className="deal-comment"><td colSpan="6"><span className="cmt-lbl">CRM</span>{d.comment}</td></tr>
                </React.Fragment>
              ))}
              <tr className="deal-total">
                <td className="deal-name">Total open forecast</td><td></td>
                <td className="num">{fmt(fcTotal)}</td>
                <td className="num">{fmtK(seatsHiPo + seatsUpside)}</td>
                <td colSpan="2"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div className="section-title">Where the Hours Go <span className="hint">meeting time by account, last 60 days</span></div>
        <div className="hours">
          {hours.map((h, i) => (
            <div className="hbar-row" key={i}>
              <div className="hbar-name">{h.name}</div>
              <div className="hbar-track"><div className="hbar-fill" style={{ width: Math.max(8, (h.n / maxHours) * 100) + '%' }}>{h.n}</div></div>
            </div>
          ))}
        </div>

        <div className="foot">
          Internal Microsoft GTM. Pipeline, seats, and forecast comments pulled from MSX (Copilot-inclusive E7 SKU only). Attainment from the MSXi Product Benchmark. FY27 forecast is in-fiscal-year billed revenue, which approximates quota retirement; anniversaries landing next fiscal (MSC, Smiths at July 1) count only their co-term months this year. Rows marked ⚑ have inferred fiscal timing to confirm. Win probability reads from each deal's CRM forecast comment. Quarterly all-up view pending Sean's quarterly target split. Not for external distribution.
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
