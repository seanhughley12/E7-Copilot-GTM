  { name: 'W2W E7 Step-up (Sirva)', acct: null, brand: '#5a6b80', guid: '65ab5020-74a8-f111-b8de-000d3a8cec07',
    billed: 1000320, monthly: 83360, fyMonths: 12, confirm: true, seats: 4168, close: 'Apr 1', prob: 'low',
    comment: 'Sirva. Invites finalized: AI/Agentic Discovery 10/5, Executive Presentation 11/2; pivoting to the Frontier Firm story. Early stage, low win prob.' },
  { name: 'Smiths · E7 Step-up (Mid-term)', acct: 'smiths', brand: '#0a2540', guid: 'fa5f22c1-9674-f111-ab0f-000d3a162e2d',
    billed: 761319, monthly: 126887, fyMonths: 6, confirm: true, seats: 12050, close: 'Jan 1', prob: 'low',
    comment: 'No E7 step-up motion this window; 9/21 Connect scoped to divestitures and the July 2027 EA renewal. Mid-term credit trues up at the July 2027 anniversary, so only co-term months count in FY27.' },
  { name: 'Echo Global · E7 Step-up (Anniversary)', acct: 'echo', brand: '#00843d', guid: '46ab0baa-d773-f111-ab0f-000d3a162e2d',
    billed: 510747, monthly: 42562, fyMonths: 12, confirm: true, seats: 4042, close: 'Apr 1', prob: 'low',
    comment: 'Little E7 activity; Echo focused on the Fastmore/ITS/RoadTex tenant consolidation ahead of the Oct 1 cutover. October Business Review scheduled with an Entra Suite buying discussion.' },
  { name: 'Harley-Davidson · E7 Step-up (Renewal)', acct: 'harley', brand: '#f6861f', guid: '4ef033e2-d873-f111-ab0f-000d3a162e2d',
    billed: 342000, monthly: 28500, fyMonths: 12, confirm: true, seats: 6000, close: 'May 1', prob: 'low',
    comment: '9/21 Agent Capability Deep Dive for a full Harley bench; strong governance engagement but hard pushback on cost. Chad Aron challenged token/API economics, Justin Knauer flagged no spend cap on PAYG.' },
];

const hours = [
  { name: 'MSC', n: 54 }, { name: 'Autoliv', n: 35 }, { name: 'CH Robinson', n: 20 },
  { name: 'Harley', n: 14 }, { name: 'Smiths', n: 10 }, { name: 'Echo', n: 2 },
];

const fmt = (n) => { const a = Math.abs(n); return (a >= 1e6 ? (n < 0 ? '-$' : '$') + (a / 1e6).toFixed(2) + 'M' : (n < 0 ? '-$' : '$') + Math.round(a / 1e3) + 'K'); };
const fmtK = (n) => n.toLocaleString();
const fyForecast = (d) => Math.round(d.monthly * d.fyMonths);
const pctCls = (p) => p >= 100 ? 'pct-over' : (p >= 80 ? 'pct-near' : 'pct-under');

// weighted attainment for a quarter: focus buckets real, Usage/Virt assumed
const bucketAttain = (b, qq) => b.focus ? (b.q[qq] != null ? b.q[qq] : null) : b.assume;
const weightedFor = (qq) => {
  const useQ = (qq === 'FY' || !WA_QUARTERS.includes(qq)) ? CURRENT_Q : qq;
  let w = 0;
  for (const b of BUCKETS) { const a = bucketAttain(b, useQ); if (a != null) w += b.weight * a; }
  return { pct: w, basisQ: useQ };
};

function App() {
  const [q, setQ] = useState('FY');
  const probMeta = { high: ['HiPo', 'prob-high', 'dot high'], med: ['Medium', 'prob-med', 'dot med'], low: ['Low', 'prob-low', 'dot low'] };
  const byProb = (p) => deals.filter((d) => d.prob === p);
  const maxHours = Math.max.apply(null, hours.map((h) => h.n));

  const dbf = DBF[q] || DBF.FY;
  const attainPct = Math.round((dbf.actuals / dbf.target) * 100);
  const togo = dbf.target - dbf.actuals;
  const over = togo <= 0;

  // billed + quota retirement from open pipeline (forecast)
  const totalForecast = deals.reduce((t, d) => t + fyForecast(d), 0);
  const totalBilled = deals.reduce((t, d) => t + d.billed, 0);

  const seatsHiPo = deals.filter((d) => d.prob === 'high').reduce((t, d) => t + d.seats, 0);
  const seatsMed = deals.filter((d) => d.prob === 'med').reduce((t, d) => t + d.seats, 0);
  const seatsLow = deals.filter((d) => d.prob === 'low').reduce((t, d) => t + d.seats, 0);
  const seatsUpside = seatsMed + seatsLow;

  const wa = weightedFor(q);
  const waBasisLabel = (q === 'FY' || !WA_QUARTERS.includes(q)) ? `YTD through ${CURRENT_Q}` : q;

  const DealLinks = ({ d }) => (
    <div className="links">
      <a className={`lnk strat ${d.acct && STRAT[d.acct] ? '' : 'off'}`} href={d.acct ? STRAT[d.acct] : '#'} target="_blank" rel="noreferrer">Strategy →</a>
      <a className="lnk crm" href={CRM(d.guid)} target="_blank" rel="noreferrer">CRM ↗</a>
    </div>
  );

  return (
    <>
      <div className="top">
        <div className="top-brand"><span className="mark">E7</span> E7 &amp; Copilot · GTM</div>
        <div className="top-right">
          <div className="qfilter"><span>Period</span>
            <select value={q} onChange={(e) => setQ(e.target.value)}>
              <option value="FY">Full Year</option>
              <option value="Q1">Q1 (Jul-Sep)</option><option value="Q2">Q2 (Oct-Dec) · current</option>
              <option value="Q3">Q3 (Jan-Mar)</option><option value="Q4">Q4 (Apr-Jun)</option>
            </select>
          </div>
          <span>{SELLER} · {FY}</span><span className="badge">INTERNAL</span>
        </div>
      </div>
      <div className="wrap">
        <div className="page-head">
          <div className="page-eyebrow">Go-to-Market Rollup · {FY} · {q === 'FY' ? 'Full Year' : q}</div>
          <h1>E7 &amp; Copilot Patch</h1>
        </div>

        <div className="exec">
          <div className="exec-kick">Patch Strategy</div>
          <h2>Q2 is already over target on banked revenue. Autoliv is incremental upside on top: close it and its co-term pre-banks Q2 while its renewal lands in Q4, setting up both ends of the year. That leaves one job: fill Q3.</h2>
          <p>Forecast and billed revenue are what the business reports. Autoliv is the swing deal, and because it splits (co-term to Q2, 12-month renewal to Q4), landing it feeds two quarters at once. Q3 is the gap to close, and MSC at a full 12 months of quota covers most of it. Run the patch quarter by quarter, not just to the annual number.</p>
          <div className="insights">
            <div className="insight"><div className="ic">Q2 · banked + upside</div><p>TQL and Polaris are banked over target. Autoliv co-term lands on top, pushing Q2 toward 200%.</p></div>
            <div className="insight"><div className="ic">Q4 · Autoliv carries it</div><p>Autoliv's 12-month renewal hits the May 1 anniversary in Q4, covering that quarter on its own.</p></div>
            <div className="insight"><div className="ic">Q3 · the one to fill</div><p>$6.3M gap. MSC at 12 months ($8.8M) plus CHR and Smiths fills it. This is where the quarter is won.</p></div>
          </div>
        </div>

        {/* 1 — FORECAST (what the boss reports) */}
        <div className="section-title">Forecast &amp; Billed Revenue <span className="hint">{q === 'FY' ? 'full year' : q} · true business, incl. E7 security · what the business reports</span></div>
        <div className="fc">
          <div className="fcard target">
            <div className="fl">Target</div>
            <div className="fv">{fmt(dbf.target)}</div>
            <div className="fs">{q === 'FY' ? 'FY27 DBF target' : q + ' DBF target'}, E7 security included.</div>
          </div>
          <div className="fcard">
            <div className="fl">Actuals + Scheduled</div>
            <div className="fv">{fmt(dbf.actuals)}</div>
            <div className="fs">Billed plus scheduled to land.</div>
            <div className="progress"><span className={over ? 'over' : ''} style={{ width: Math.min(100, attainPct) + '%' }} /></div>
            <div className="pct-row"><span>{attainPct}% attained</span><span>{over ? 'over target' : fmt(togo) + ' to go'}</span></div>
          </div>
          <div className="fcard">
            <div className="fl">{over ? 'Over Target' : 'Target To Go'}</div>
            <div className={`fv ${over ? 'over' : 'togo'}`}>{over ? '+' + fmt(-togo) : fmt(togo)}</div>
            <div className="fs">{over ? 'Ahead of the number.' : 'Remaining to hit the number.'}</div>
          </div>
          <div className="fcard">
            <div className="fl">Open Pipeline Forecast</div>
            <div className="fv">{fmt(totalForecast)}</div>
            <div className="fs">In-FY forecast across {deals.length} open E7 deals. {fmt(totalBilled)} billed co-term.</div>
          </div>
        </div>
        <div className="dual">
          <div className="dcell"><span className="dl">Open Pipeline · Billed (co-term)</span><b>{fmt(totalBilled)}</b><small>Invoiced revenue from the open E7 deals. What upper leadership tracks.</small></div>
          <div className="dcell q"><span className="dl">Open Pipeline · FY27 Forecast (≈ quota retirement)</span><b>{fmt(totalForecast)}</b><small>In-fiscal-year revenue that retires quota. What Sean and Jason are paid on.</small></div>
        </div>

        {/* QUARTERLY PACING */}
        <div className="section-title">Quarterly Pacing <span className="hint">run the patch quarter by quarter. Banked + where open deals land. Autoliv splits Q2/Q4.</span></div>
        <div className="pacing">
          {['Q1', 'Q2', 'Q3', 'Q4'].map((qq) => {
            const p = PACING[qq];
            const landSum = p.lands.reduce((t, l) => t + l.amt, 0);
            const proj = p.banked + landSum;
            const projPct = Math.round((proj / p.target) * 100);
            const bankedPct = Math.round((p.banked / p.target) * 100);
            const gapNow = p.target - p.banked;
            const isFill = qq === 'Q3';
            return (
              <div className={`pcard ${isFill ? 'fill' : ''} ${proj >= p.target ? 'covered' : ''}`} key={qq}>
                <div className="pc-head"><b>{p.label}</b>{isFill && <span className="pc-tag">Fill this</span>}{!isFill && proj >= p.target && <span className="pc-tag ok">On pace</span>}</div>
                <div className="pc-target">Target {fmt(p.target)}</div>
                <div className="pc-bar">
                  <span className="pc-banked" style={{ width: Math.min(100, bankedPct) + '%' }} />
                  <span className="pc-proj" style={{ width: Math.min(100 - Math.min(100, bankedPct), Math.max(0, projPct - bankedPct)) + '%' }} />
                </div>
                <div className="pc-nums"><span>Banked {fmt(p.banked)}</span><span className={proj >= p.target ? 'ok' : 'gap'}>{projPct}% projected</span></div>
                <div className="pc-lands">
                  {p.lands.length ? p.lands.map((l, i) => (
                    <div className="pc-land" key={i}><span className={`pc-dot ${l.prob}`} />{l.name}<span className="pc-amt">{fmt(l.amt)}</span></div>
                  )) : <div className="pc-land muted">No open deals land here</div>}
                </div>
                {gapNow > 0 && <div className="pc-gap">Gap to target: <b>{fmt(gapNow)}</b></div>}
                {gapNow <= 0 && <div className="pc-gap ok">Over target by <b>{fmt(-gapNow)}</b></div>}
              </div>
            );
          })}
        </div>

        {/* 2 — SEATS */}
        <div className="section-title">Net-New Copilot Seats <span className="hint">Copilot-inclusive E7 seats. HiPo commit vs. upside white space.</span></div>
        <div className="seats-row">
          <div className="seat-card hipo">
            <div className="seat-kick">HiPo · committed path</div>
            <div className="seat-num">{fmtK(seatsHiPo)}</div>
            <div className="seat-desc">Net-new Copilot seats in HiPo deals (Autoliv). The seats we have conviction on this half.</div>
          </div>
          <div className="seat-card upside">
            <div className="seat-kick">Upside · white space we are going after</div>
            <div className="seat-num">{fmtK(seatsUpside)}</div>
            <div className="seat-desc">Net-new Copilot seats in Medium and Low deals. The growth target is converting these to commit.</div>
            <div className="seat-split">
              <div>Medium<b>{fmtK(seatsMed)}</b>MSC</div>
              <div>Low<b>{fmtK(seatsLow)}</b>CHR, Smiths, Harley, Echo, Sirva</div>
            </div>
          </div>
        </div>

        {/* 3 — HIPO */}
        <div className="section-title">HiPo View <span className="hint">deals by win probability, read from CRM forecast comments</span></div>
        <div className="hipo">
          {['high', 'med', 'low'].map((p) => {
            const list = byProb(p);
            const sum = list.reduce((t, d) => t + fyForecast(d), 0);
            return (
              <div className="hipo-col" key={p}>
                <h3><span className={probMeta[p][2]} /> {probMeta[p][0]}</h3>
                <div className="hc-sum">{list.length} deals · {fmt(sum)} forecast</div>
                {list.map((d, i) => (
                  <a className="hipo-chip" style={{ '--brand': d.brand }} key={i} href={d.acct && STRAT[d.acct] ? STRAT[d.acct] : CRM(d.guid)} target="_blank" rel="noreferrer">
                    <div className="hc-top"><span className="hc-name">{d.name.split(' · ')[0]}</span><span className="hc-val">{fmt(fyForecast(d))}</span></div>
                    <div className="hc-meta">{fmtK(d.seats)} seats · closes {d.close}</div>
                  </a>
                ))}
                {!list.length && <div className="hc-meta">None.</div>}
              </div>
            );
          })}
        </div>

        {/* 4 — DEALS */}
        <div className="section-title">Deals That Decide <span className="hint">FY27 forecast (in-year billed ≈ quota) · latest CRM comment · click to strategy or CRM</span></div>
        <div className="deals">
          <table>
            <thead><tr><th>Deal</th><th>Prob</th><th style={{ textAlign: 'right' }}>FY27 Forecast</th><th style={{ textAlign: 'right' }}>Net-new Seats</th><th>Close</th><th>Links</th></tr></thead>
            <tbody>
              {deals.map((d, i) => (
                <React.Fragment key={i}>
                  <tr className="deal-main">
                    <td><div className="deal-name">{d.name.split(' · ')[0]}</div><div className="deal-sub">{d.name.indexOf(' · ') >= 0 ? d.name.split(' · ')[1] : ''}</div></td>
                    <td><span className={`prob-pill ${probMeta[d.prob][1]}`}>{probMeta[d.prob][0]}</span></td>
                    <td className="num">{fmt(fyForecast(d))} {d.confirm && <span className="flag" title="Fiscal timing inferred, confirm with Sean">⚑</span>}<div className="num-sub">{d.fyMonths} mo in FY · {fmt(d.billed)} billed co-term</div></td>
                    <td className="num">{fmtK(d.seats)}</td>
                    <td>{d.close}</td>
                    <td><DealLinks d={d} /></td>
                  </tr>
                  <tr className="deal-comment"><td colSpan="6"><span className="cmt-lbl">CRM</span>{d.comment}</td></tr>
                </React.Fragment>
              ))}
              <tr className="deal-total">
                <td className="deal-name">Total open forecast</td><td></td>
                <td className="num">{fmt(totalForecast)}</td>
                <td className="num">{fmtK(seatsHiPo + seatsUpside)}</td>
                <td colSpan="2"></td>
              </tr>
            </tbody>
          </table>
        </div>

        {/* 5 — HOURS */}
        <div className="section-title">Where the Hours Go <span className="hint">meeting time by account, last 60 days</span></div>
        <div className="hours">
          {hours.map((h, i) => (
            <div className="hbar-row" key={i}>
              <div className="hbar-name">{h.name}</div>
              <div className="hbar-track"><div className="hbar-fill" style={{ width: Math.max(8, (h.n / maxHours) * 100) + '%' }}>{h.n}</div></div>
            </div>
          ))}
        </div>

        {/* 6 — WEIGHTED ATTAINMENT (comp, bottom) */}
        <div className="section-title">Weighted Attainment · Comp View <span className="hint">how comp pays. Focus buckets real; Usage and Virtualization held at assumptions.</span></div>
        <div className="wa-hero">
          <div className="wa-big-card">
            <div className="wl">{FY} weighted attainment · {waBasisLabel}</div>
            <div className="wv">{Math.round(wa.pct)}%</div>
            <div className="ws">Blended across all four comp buckets at plan weight, using {wa.basisQ} standing. Q3 and Q4 focus data not yet earned.</div>
            <div className="wa-qstrip">
              {WA_QUARTERS.map((qq) => (
                <div className={`wa-q ${wa.basisQ === qq ? 'on' : ''}`} key={qq}><div className="wq-k">{qq}</div><div className="wq-v">{Math.round(weightedFor(qq).pct)}%</div></div>
              ))}
              <div className="wa-q"><div className="wq-k">Q3</div><div className="wq-v">—</div></div>
              <div className="wa-q"><div className="wq-k">Q4</div><div className="wq-v">—</div></div>
            </div>
          </div>
          <div className="bk-table">
            <table>
              <thead><tr><th>Earning bucket ({wa.basisQ})</th><th style={{ textAlign: 'right' }}>Weight</th><th style={{ textAlign: 'right' }}>Attainment</th><th style={{ textAlign: 'right' }}>Contribution</th></tr></thead>
              <tbody>
                {BUCKETS.map((b) => {
                  const a = bucketAttain(b, wa.basisQ);
                  return (
                    <tr className={`bk-row ${b.focus ? 'focus' : ''}`} key={b.key}>
                      <td><div className="bk-name">{b.name}{b.focus ? <span className="bk-focus-tag">Focus</span> : <span className="bk-assume">Assumed</span>}</div><div className="bk-sub">{b.focus ? 'E7 retires ' + b.retires : 'held at ' + b.assume + '%, not patch focus'}</div></td>
                      <td className="num">{Math.round(b.weight * 100)}%</td>
                      <td className="num">{a != null ? <span className={pctCls(a)}>{Math.round(a)}%</span> : '—'}</td>
                      <td className="num">{a != null ? (b.weight * a).toFixed(1) + '%' : '—'}</td>
                    </tr>
                  );
                })}
                <tr className="deal-total"><td className="bk-name">Weighted total</td><td></td><td></td><td className="num">{Math.round(wa.pct)}%</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div className="wa-note">Q1 closed at {Math.round(weightedFor('Q1').pct)}% weighted. {CURRENT_Q} is tracking {Math.round(weightedFor('Q2').pct)}% with AI Workforce and Copilot + Agents both near or above target. Usage held at 120% and Virtualization at 100% are assumptions, not patch focus. Confirm actuals from the MSX Earnings view.</div>

        <div className="foot">
          Internal Microsoft GTM. Forecast and billed from MSX (true business, E7 security included; quarterly DBF foots to the FY). Weights from MSX Earnings: AI Workforce 40%, Copilot + Agents 30%, Copilot + Agent Usage 15%, Virtualization 15%. Focus buckets use real per-quarter attainment; Usage held at 120% and Virtualization at 100% as Sean's assumptions. FY27 forecast is in-fiscal-year billed revenue, which approximates quota retirement; anniversaries landing next fiscal (MSC, Smiths at July 1) count only co-term months. Rows marked ⚑ have inferred fiscal timing to confirm. Not for external distribution.
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
