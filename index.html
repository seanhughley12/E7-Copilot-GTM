<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>E7 &amp; Copilot GTM · Sean Hughley</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0a2540;--navy-deep:#061a30;--blue:#0078d4;--blue-soft:#e9f3fc;--cyan:#50e6ff;--gold:#e0a53a;--purple:#5c2d91;
  --ink:#15202e;--muted:#5d6b80;--border:#e3e9f1;--surface:#fff;--bg:#f3f7fb;
  --green:#1a9c5b;--amber:#e0962a;--red:#d1472c;
  --radius:14px;--shadow:0 2px 14px rgba(10,37,64,.07);--shadow-lg:0 14px 44px rgba(10,37,64,.15);
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.top{position:sticky;top:0;z-index:50;background:rgba(10,37,64,.98);backdrop-filter:blur(10px);color:#fff;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 18px rgba(0,0,0,.2)}
.top-brand{display:flex;align-items:center;gap:13px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px}
.top-brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--navy)}
.top-right{display:flex;align-items:center;gap:14px;font-size:12.5px;color:rgba(255,255,255,.65)}
.qfilter{display:flex;align-items:center;gap:8px}
.qfilter select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
.qfilter select option{color:#15202e}
.badge{background:var(--gold);color:var(--navy);font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.5px}
.wrap{max-width:1240px;margin:0 auto;padding:40px}
.page-eyebrow{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.page-head h1{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;letter-spacing:-1px;color:var(--navy)}
.section-title{font-family:'Space Grotesk',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:700;margin:38px 0 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.section-title .hint{font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500}
.exec{background:linear-gradient(135deg,var(--navy),#123a63);color:#fff;border-radius:18px;padding:30px 36px;box-shadow:var(--shadow-lg);margin-top:18px}
.exec-kick{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.exec h2{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:600;line-height:1.4;max-width:84ch}
.exec p{font-size:14px;color:rgba(255,255,255,.82);margin-top:10px;max-width:92ch}
.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.insight{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:14px 16px}
.insight .ic{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
.insight p{font-size:13px;color:#fff;margin:0;line-height:1.45}
/* weighted hero */
.wa-hero{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px;margin-top:4px}
.wa-big-card{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:16px;padding:28px 32px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;justify-content:center}
.wa-big-card .wl{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan)}
.wa-big-card .wv{font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:700;line-height:1;letter-spacing:-2px;margin:6px 0}
.wa-big-card .ws{font-size:13px;color:rgba(255,255,255,.82);line-height:1.5}
.wa-proj{display:flex;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)}
.wa-proj div{font-size:12px;color:rgba(255,255,255,.75)}
.wa-proj b{display:block;font-family:'Space Grotesk',sans-serif;font-size:22px;color:#fff;font-weight:700}
.bk-table{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.bk-table table{width:100%;border-collapse:collapse}
.bk-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:2px solid var(--border);background:var(--bg)}
.bk-table td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px}
.bk-table tr:last-child td{border-bottom:none}
.bk-row.focus td{background:rgba(0,120,212,.04)}
.bk-name{font-weight:700;color:var(--navy)}
.bk-sub{font-size:11px;color:var(--muted)}
.bk-assume{font-size:10px;font-weight:700;color:var(--amber);background:rgba(224,150,42,.12);padding:2px 7px;border-radius:999px;margin-left:6px}
.bk-focus-tag{font-size:10px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:2px 7px;border-radius:999px;margin-left:6px}
.num{font-family:'Space Grotesk',sans-serif;font-weight:600;text-align:right;white-space:nowrap}
.pct-over{background:rgba(26,156,91,.14);color:var(--green);font-weight:800;padding:2px 8px;border-radius:999px;font-size:12px}
.pct-near{background:rgba(224,150,42,.16);color:var(--amber);font-weight:800;padding:2px 8px;border-radius:999px;font-size:12px}
.pct-under{background:#eef2f7;color:var(--muted);font-weight:800;padding:2px 8px;border-radius:999px;font-size:12px}
/* dbf lenses */
.lenses{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lens{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.lens.true{border-color:rgba(0,120,212,.3);background:linear-gradient(135deg,#fff,var(--blue-soft))}
.lens-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.lens-h b{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--navy)}
.lens-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:3px 9px;border-radius:999px}
.lens-tag.rep{background:#eef2f7;color:var(--muted)}
.lens-tag.tru{background:var(--blue-soft);color:var(--blue)}
.lens-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lens-cell .ll{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.lens-cell .lv{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--navy);margin-top:3px}
.lens-cell .lv.togo{color:var(--red)}
.delta-note{grid-column:1 / -1;margin-top:14px;background:var(--navy);color:#fff;border-radius:10px;padding:14px 18px;font-size:13.5px;line-height:1.5}
.delta-note b{color:var(--cyan)}
/* seats */
.seats-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.seat-card{border-radius:16px;padding:26px 30px}
.seat-card.hipo{background:linear-gradient(120deg,var(--navy-deep),var(--blue));color:#fff;box-shadow:var(--shadow-lg)}
.seat-card.upside{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.seat-kick{font-size:11.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.seat-card.hipo .seat-kick{color:var(--cyan)}.seat-card.upside .seat-kick{color:var(--muted)}
.seat-num{font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.seat-card.upside .seat-num{color:var(--navy)}
.seat-desc{font-size:13px;margin-top:10px}
.seat-card.hipo .seat-desc{color:rgba(255,255,255,.82)}.seat-card.upside .seat-desc{color:var(--muted)}
.seat-split{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.seat-split div{font-size:12.5px;color:var(--muted)}
.seat-split b{display:block;font-family:'Space Grotesk',sans-serif;font-size:19px;color:var(--navy);font-weight:700}
/* hipo + deals */
.hipo{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hipo-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.hipo-col h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.hipo-col .hc-sum{font-size:12.5px;color:var(--muted);margin-bottom:14px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%}
.dot.high{background:var(--green)}.dot.med{background:var(--amber)}.dot.low{background:var(--muted)}
.hipo-chip{display:block;padding:12px 14px;border:1px solid var(--border);border-left:4px solid var(--brand,var(--blue));border-radius:10px;margin-bottom:10px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.hipo-chip:hover{transform:translateX(2px);box-shadow:var(--shadow)}
.hipo-chip .hc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hipo-chip .hc-name{font-weight:700;font-size:14px;color:var(--navy)}
.hipo-chip .hc-val{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--navy)}
.hipo-chip .hc-meta{font-size:12px;color:var(--muted);margin-top:3px}
.deals{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.deals table{width:100%;border-collapse:collapse}
.deals th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;padding:14px 16px;border-bottom:2px solid var(--border);background:var(--bg)}
.deals td{padding:13px 16px;font-size:13.5px;vertical-align:middle}
.deal-main td{border-bottom:none;padding-bottom:5px}
.deal-name{font-weight:600;color:var(--navy)}.deal-sub{font-size:12px;color:var(--muted)}
.num-sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.flag{color:var(--amber);font-weight:700;cursor:help}
.prob-pill{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:3px 9px;border-radius:999px}
.prob-high{background:rgba(26,156,91,.14);color:var(--green)}.prob-med{background:rgba(224,150,42,.16);color:var(--amber)}.prob-low{background:#eef2f7;color:var(--muted)}
.links{display:flex;gap:8px;white-space:nowrap}
.lnk{font-size:12px;font-weight:700;text-decoration:none;padding:6px 11px;border-radius:8px;border:1px solid var(--border)}
.lnk.strat{color:var(--blue);border-color:rgba(0,120,212,.3)}.lnk.strat:hover{background:var(--blue-soft)}
.lnk.crm{color:var(--muted)}.lnk.crm:hover{background:var(--bg)}.lnk.off{opacity:.4;pointer-events:none}
.deal-comment td{padding:0 16px 13px 16px;font-size:12.5px;color:var(--muted);line-height:1.5;border-bottom:1px solid var(--border)}
.cmt-lbl{font-weight:800;color:var(--navy);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;margin-right:6px}
.deal-total td{font-weight:700;border-top:2px solid var(--border);border-bottom:none}
.hours{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow)}
.hbar-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.hbar-row:last-child{margin-bottom:0}
.hbar-name{width:140px;font-size:13.5px;font-weight:600;color:var(--navy);flex-shrink:0}
.hbar-track{flex:1;background:var(--bg);border-radius:8px;height:26px;overflow:hidden}
.hbar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-size:11.5px;font-weight:700;min-width:36px}
.foot{color:var(--muted);font-size:12.5px;margin-top:40px;line-height:1.6;border-top:1px solid var(--border);padding-top:18px}
@media(max-width:900px){.wa-hero,.lenses,.seats-row,.insights,.hipo{grid-template-columns:1fr}.wrap{padding:24px}.seat-num,.wa-big-card .wv{font-size:42px}}
</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
const SELLER = 'Sean Hughley';
const FY = 'FY27';
const COPILOT_FACTOR = 0.56; // an E7 deal retires 100% of AI Workforce and 56% of Copilot + Agents

/* ═══ COMP BUCKETS — weights from MSX Earnings. Sean focuses on E7 + Copilot (70% of plan).
   Usage + Virtualization are held at Sean's assumptions (not his focus). ═══ */
const BUCKETS = [
  { key: 'aiw',   name: 'AI Workforce Cloud (w/ES)', weight: 0.40, focus: true,  retires: '100% of E7 quota',
    q: { Q1: 104.56, Q2: 91.47 } },
  { key: 'cop',   name: 'Copilot + Agents',          weight: 0.30, focus: true,  retires: '56% of E7 quota',
    q: { Q1: 68.25, Q2: 87.74 } },
  { key: 'usage', name: 'Copilot + Agent Usage',     weight: 0.15, focus: false, assume: 120,
    q: { Q1: 145.10, Q2: 116.23 } },
  { key: 'virt',  name: 'Virtualization',            weight: 0.15, focus: false, assume: 100,
    q: { Q1: 73.58, Q2: 0 } },
];

/* ═══ ALL-UP DBF by quarter (with E7 security). Foots to FY exactly. ═══ */
const DBF = {
  FY: { target: 19891155, actuals: 11272578 },
  Q1: { target: 4579594,  actuals: 2705737 },
  Q2: { target: 3674739,  actuals: 5852664 },
  Q3: { target: 8804186,  actuals: 2491194 },
  Q4: { target: 2832635,  actuals: 222984 },
};
/* MSXi-reported FY (security excluded) for the two-lens comparison */
const DBF_REPORTED_FY = { target: 15567624, actuals: 7952784 };

const CRM = (guid) => `https://microsoftsales.crm.dynamics.com/main.aspx?pagetype=entityrecord&etn=opportunity&id=${guid}`;
const STRAT = {
  autoliv: 'https://seanhughley12.github.io/Autoliv.Harley.Smiths.Echo/autoliv/',
  harley: 'https://seanhughley12.github.io/Autoliv.Harley.Smiths.Echo/',
  smiths: 'https://seanhughley12.github.io/Autoliv.Harley.Smiths.Echo/',
  echo: 'https://seanhughley12.github.io/Autoliv.Harley.Smiths.Echo/',
  msc: 'https://seanhughley12.github.io/MSC/',
  chrobinson: 'https://seanhughley12.github.io/CHR.Polaris.Sriva/',
};

const deals = [
  { name: 'MSC · 73K Seats, The AI Platform', acct: 'msc', brand: '#13477e', guid: '65aaeb01-1c76-f111-ab0f-7ced8dda43b8',
    billed: 4412101, monthly: 735350, fyMonths: 6, confirm: false, seats: 62021, close: 'Jan 20', prob: 'med',
    comment: 'Sept 25 E7/Agent 365 discussion with MSC security and IT. Agent-governance need validated and tied to FinOps and cost predictability. Deck is now a CFO capital-allocation story: 71K fleet at $13, 96.2% absorbed. Anniversary Jul 1 so only the 6 co-term months retire in FY27.' },
  { name: 'CH Robinson · 12,020 Seats', acct: 'chrobinson', brand: '#0a7d3a', guid: '3cc8156b-1d76-f111-ab0f-7ced8dda43b8',
    billed: 2307840, monthly: 192320, fyMonths: 12, confirm: true, seats: 12020, close: 'Mar 18', prob: 'low',
    comment: 'On 9/17 pitched E7 at $16/user vs ~$30 today across ~1,000 Copilot licenses. CTO Mike Neill and Terry Bigaouette asked if $16 is volume-contingent on 80%+ coverage. Next: lock the volume construct.' },
  { name: 'Autoliv · E7 Step-up (Anniversary)', acct: 'autoliv', brand: '#005495', guid: '512dda65-c773-f111-ab0f-000d3a162e2d',
    billed: 1374504, monthly: 343626, fyMonths: 16, confirm: false, seats: 18080, close: 'Dec 1', prob: 'high',
    comment: '9/25: interest confirmed but no support yet for 80% coverage; customer building a lower-commitment counter-proposal. Bob Hale pulled the step-up into a commercial offer. Anniversary April 2027 is in FY27, so all 16 months retire this year.' },
  { name: 'W2W E7 Step-up (Sirva)', acct: null, brand: '#5a6b80', guid: '65ab5020-74a8-f111-b8de-000d3a8cec07',
    billed: 1000320, monthly: 83360, fyMonths: 12, confirm: true, seats: 4168, close: 'Apr 1', prob: 'low',
    comment: 'Sirva. Invites finalized: AI/Agentic Discovery 10/5, Executive Presentation 11/2; pivoting to the Frontier Firm story. Early stage, low win prob.' },
  { name: 'Smiths · E7 Step-up (Mid-term)', acct: 'smiths', brand: '#0a2540', guid: 'fa5f22c1-9674-f111-ab0f-000d3a162e2d',
    billed: 761319, monthly: 126887, fyMonths: 6, confirm: true, seats: 12050, close: 'Jan 1', prob: 'low',
    comment: 'No E7 step-up motion this window; 9/21 Connect scoped to divestitures and the July 2027 EA renewal. Mid-term credit trues up at the July 2027 anniversary, so only the co-term months count in FY27.' },
  { name: 'Echo Global · E7 Step-up (Anniversary)', acct: 'echo', brand: '#00843d', guid: '46ab0baa-d773-f111-ab0f-000d3a162e2d',
    billed: 510747, monthly: 42562, fyMonths: 12, confirm: true, seats: 4042, close: 'Apr 1', prob: 'low',
    comment: 'Little E7 activity; Echo focused on the Fastmore/ITS/RoadTex tenant consolidation ahead of the Oct 1 cutover. October Business Review scheduled with an Entra Suite buying discussion.' },
  { name: 'Harley-Davidson · E7 Step-up (Renewal)', acct: 'harley', brand: '#f6861f', guid: '4ef033e2-d873-f111-ab0f-000d3a162e2d',
    billed: 342000, monthly: 28500, fyMonths: 12, confirm: true, seats: 6000, close: 'May 1', prob: 'low',
    comment: '9/21 Agent Capability Deep Dive for a full Harley bench; strong governance engagement but hard pushback on cost. Chad Aron challenged token/API economics, Justin Knauer flagged no spend cap on PAYG.' },
];

const hours = [
  { name: 'MSC', n: 54 }, { name: 'Autoliv', n: 35 }, { name: 'CH Robinson', n: 20 },
  { name: 'Harley', n: 14 }, { name: 'Smiths', n: 10 }, { name: 'Echo', n: 2 },
];

const fmt = (n) => n >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'M' : '$' + Math.round(n / 1e3) + 'K';
const fmtK = (n) => n.toLocaleString();
const fyForecast = (d) => Math.round(d.monthly * d.fyMonths);
const pctCls = (p) => p >= 100 ? 'pct-over' : (p >= 80 ? 'pct-near' : 'pct-under');

function App() {
  const [q, setQ] = useState('Q2'); // current quarter
  const probMeta = { high: ['HiPo', 'prob-high', 'dot high'], med: ['Medium', 'prob-med', 'dot med'], low: ['Low', 'prob-low', 'dot low'] };
  const byProb = (p) => deals.filter((d) => d.prob === p);
  const maxHours = Math.max.apply(null, hours.map((h) => h.n));

  // bucket attainment for the selected quarter (focus buckets use real; others use Sean's assumption)
  const bucketNow = (b) => b.focus ? (b.q[q] != null ? b.q[q] : 0) : b.assume;
  const weightedNow = BUCKETS.reduce((t, b) => t + b.weight * bucketNow(b), 0);
  // projection: add HiPo / all open forecast into the two focus buckets
  const dbf = DBF[q] || DBF.FY;
  const fcHiPo = deals.filter((d) => d.prob === 'high').reduce((t, d) => t + fyForecast(d), 0);
  const fcAll = deals.reduce((t, d) => t + fyForecast(d), 0);
  const lift = (extra) => {
    // extra revenue lifts AIW at 100% and Copilot at 56%, as a share of the quarter target
    const aiwLift = (extra / dbf.target) * 100;
    const copLift = (extra * COPILOT_FACTOR / dbf.target) * 100;
    let w = 0;
    for (const b of BUCKETS) {
      let a = bucketNow(b);
      if (b.key === 'aiw') a += aiwLift;
      if (b.key === 'cop') a += copLift;
      w += b.weight * a;
    }
    return w;
  };
  const weightedHiPo = lift(fcHiPo);
  const weightedAll = lift(fcAll);

  const seatsHiPo = deals.filter((d) => d.prob === 'high').reduce((t, d) => t + d.seats, 0);
  const seatsMed = deals.filter((d) => d.prob === 'med').reduce((t, d) => t + d.seats, 0);
  const seatsLow = deals.filter((d) => d.prob === 'low').reduce((t, d) => t + d.seats, 0);
  const seatsUpside = seatsMed + seatsLow;

  const repTogo = Math.max(0, DBF_REPORTED_FY.target - DBF_REPORTED_FY.actuals);
  const truTogo = Math.max(0, DBF.FY.target - DBF.FY.actuals);
  const deltaTarget = DBF.FY.target - DBF_REPORTED_FY.target;

  const DealLinks = ({ d }) => (
    <div className="links">
      <a className={`lnk strat ${d.acct && STRAT[d.acct] ? '' : 'off'}`} href={d.acct ? STRAT[d.acct] : '#'} target="_blank" rel="noreferrer">Strategy →</a>
      <a className="lnk crm" href={CRM(d.guid)} target="_blank" rel="noreferrer">CRM ↗</a>
    </div>
  );

  return (
    <>
      <div className="top">
        <div className="top-brand"><span className="mark">E7</span> E7 &amp; Copilot · GTM</div>
        <div className="top-right">
          <div className="qfilter"><span>Period</span>
            <select value={q} onChange={(e) => setQ(e.target.value)}>
              <option value="FY">Full Year</option>
              <option value="Q1">Q1 (Jul-Sep)</option><option value="Q2">Q2 (Oct-Dec) · current</option>
              <option value="Q3">Q3 (Jan-Mar)</option><option value="Q4">Q4 (Apr-Jun)</option>
            </select>
          </div>
          <span>{SELLER} · {FY}</span><span className="badge">INTERNAL</span>
        </div>
      </div>
      <div className="wrap">
        <div className="page-head">
          <div className="page-eyebrow">Go-to-Market Rollup · {FY} · {q === 'FY' ? 'Full Year' : q}</div>
          <h1>E7 &amp; Copilot Patch</h1>
        </div>

        <div className="exec">
          <div className="exec-kick">Patch Strategy</div>
          <h2>Comp is paid on weighted attainment, and 70% of the plan sits in the two buckets this patch drives: AI Workforce (40%) and Copilot + Agents (30%). The job is to push those two over target, because every E7 deal lifts both at once.</h2>
          <p>Every E7 deal retires 100% of AI Workforce quota and 56% of Copilot + Agents quota off its entire revenue. Autoliv (HiPo) alone is the swing. The shared blocker on the medium and low deals is cost and consumption economics, not product fit. One FinOps plus Agent 365 proof unlocks the upside.</p>
          <div className="insights">
            <div className="insight"><div className="ic">The comp number</div><p>Weighted attainment is what pays. Focus buckets (AIW + Copilot) are 70% of the plan. Move them, move the check.</p></div>
            <div className="insight"><div className="ic">The multiplier</div><p>One E7 deal hits two buckets: 100% to AI Workforce, 56% to Copilot + Agents. Autoliv lifts both.</p></div>
            <div className="insight"><div className="ic">The hidden credit</div><p>MSXi excludes the E7 security attach. True business is $19.9M target vs $15.6M reported, a $4.3M gap you should get credit for.</p></div>
          </div>
        </div>

        <div className="section-title">Weighted Attainment · Comp View <span className="hint">{q === 'FY' ? 'full year' : q} · the number comp is paid on. Usage and Virtualization held at assumptions.</span></div>
        <div className="wa-hero">
          <div className="wa-big-card">
            <div className="wl">{FY}-{q === 'FY' ? 'YTD' : q} weighted attainment</div>
            <div className="wv">{Math.round(weightedNow)}%</div>
            <div className="ws">Blended across all four comp buckets at plan weight. Projected with pipeline below.</div>
            <div className="wa-proj">
              <div>+ HiPo<b>{Math.round(weightedHiPo)}%</b></div>
              <div>+ all open<b>{Math.round(weightedAll)}%</b></div>
            </div>
          </div>
          <div className="bk-table">
            <table>
              <thead><tr><th>Earning bucket</th><th style={{ textAlign: 'right' }}>Weight</th><th style={{ textAlign: 'right' }}>Attainment</th><th style={{ textAlign: 'right' }}>Contribution</th></tr></thead>
              <tbody>
                {BUCKETS.map((b) => {
                  const a = bucketNow(b);
                  return (
                    <tr className={`bk-row ${b.focus ? 'focus' : ''}`} key={b.key}>
                      <td><div className="bk-name">{b.name}{b.focus ? <span className="bk-focus-tag">Focus</span> : <span className="bk-assume">Assumed</span>}</div><div className="bk-sub">{b.focus ? 'E7 retires ' + b.retires : 'held at ' + b.assume + '%, not patch focus'}</div></td>
                      <td className="num">{Math.round(b.weight * 100)}%</td>
                      <td className="num"><span className={pctCls(a)}>{Math.round(a)}%</span></td>
                      <td className="num">{(b.weight * a).toFixed(1)}%</td>
                    </tr>
                  );
                })}
                <tr className="deal-total"><td className="bk-name">Weighted total</td><td></td><td></td><td className="num">{Math.round(weightedNow)}%</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div className="section-title">Reported vs True Business <span className="hint">MSXi excludes the E7 security attach. Full year.</span></div>
        <div className="lenses">
          <div className="lens">
            <div className="lens-h"><b>MSXi Reported</b><span className="lens-tag rep">System of record</span></div>
            <div className="lens-grid">
              <div className="lens-cell"><div className="ll">Target</div><div className="lv">{fmt(DBF_REPORTED_FY.target)}</div></div>
              <div className="lens-cell"><div className="ll">Actuals + Sched</div><div className="lv">{fmt(DBF_REPORTED_FY.actuals)}</div></div>
              <div className="lens-cell"><div className="ll">Target To Go</div><div className="lv togo">{fmt(repTogo)}</div></div>
            </div>
          </div>
          <div className="lens true">
            <div className="lens-h"><b>True Business (incl. E7 Security)</b><span className="lens-tag tru">What you drive</span></div>
            <div className="lens-grid">
              <div className="lens-cell"><div className="ll">Target</div><div className="lv">{fmt(DBF.FY.target)}</div></div>
              <div className="lens-cell"><div className="ll">Actuals + Sched</div><div className="lv">{fmt(DBF.FY.actuals)}</div></div>
              <div className="lens-cell"><div className="ll">Target To Go</div><div className="lv togo">{fmt(truTogo)}</div></div>
            </div>
          </div>
          <div className="delta-note">The scorecard credits <b>{Math.round((DBF_REPORTED_FY.actuals / DBF_REPORTED_FY.target) * 100)}%</b> on {fmt(DBF_REPORTED_FY.target)}, but the full E7 motion you run is worth <b>{fmt(deltaTarget)}</b> more in target. The security attach is real business the system of record hides. Lead with both numbers.</div>
        </div>

        <div className="section-title">Net-New Copilot Seats <span className="hint">Copilot-inclusive E7 seats. HiPo commit vs. upside white space.</span></div>
        <div className="seats-row">
          <div className="seat-card hipo">
            <div className="seat-kick">HiPo · committed path</div>
            <div className="seat-num">{fmtK(seatsHiPo)}</div>
            <div className="seat-desc">Net-new Copilot seats in HiPo deals (Autoliv). The seats we have conviction on this half.</div>
          </div>
          <div className="seat-card upside">
            <div className="seat-kick">Upside · white space we are going after</div>
            <div className="seat-num">{fmtK(seatsUpside)}</div>
            <div className="seat-desc">Net-new Copilot seats in Medium and Low deals. The growth target is converting these to commit.</div>
            <div className="seat-split">
              <div>Medium<b>{fmtK(seatsMed)}</b>MSC</div>
              <div>Low<b>{fmtK(seatsLow)}</b>CHR, Smiths, Harley, Echo, Sirva</div>
            </div>
          </div>
        </div>

        <div className="section-title">HiPo View <span className="hint">deals by win probability, read from CRM forecast comments</span></div>
        <div className="hipo">
          {['high', 'med', 'low'].map((p) => {
            const list = byProb(p);
            const sum = list.reduce((t, d) => t + fyForecast(d), 0);
            return (
              <div className="hipo-col" key={p}>
                <h3><span className={probMeta[p][2]} /> {probMeta[p][0]}</h3>
                <div className="hc-sum">{list.length} deals · {fmt(sum)} forecast</div>
                {list.map((d, i) => (
                  <a className="hipo-chip" style={{ '--brand': d.brand }} key={i} href={d.acct && STRAT[d.acct] ? STRAT[d.acct] : CRM(d.guid)} target="_blank" rel="noreferrer">
                    <div className="hc-top"><span className="hc-name">{d.name.split(' · ')[0]}</span><span className="hc-val">{fmt(fyForecast(d))}</span></div>
                    <div className="hc-meta">{fmtK(d.seats)} seats · closes {d.close}</div>
                  </a>
                ))}
                {!list.length && <div className="hc-meta">None.</div>}
              </div>
            );
          })}
        </div>

        <div className="section-title">Deals That Decide <span className="hint">FY27 forecast (in-year billed ≈ quota) · latest CRM comment · click to strategy or CRM</span></div>
        <div className="deals">
          <table>
            <thead><tr><th>Deal</th><th>Prob</th><th style={{ textAlign: 'right' }}>FY27 Forecast</th><th style={{ textAlign: 'right' }}>Net-new Seats</th><th>Close</th><th>Links</th></tr></thead>
            <tbody>
              {deals.map((d, i) => (
                <React.Fragment key={i}>
                  <tr className="deal-main">
                    <td><div className="deal-name">{d.name.split(' · ')[0]}</div><div className="deal-sub">{d.name.indexOf(' · ') >= 0 ? d.name.split(' · ')[1] : ''}</div></td>
                    <td><span className={`prob-pill ${probMeta[d.prob][1]}`}>{probMeta[d.prob][0]}</span></td>
                    <td className="num">{fmt(fyForecast(d))} {d.confirm && <span className="flag" title="Fiscal timing inferred, confirm with Sean">⚑</span>}<div className="num-sub">{d.fyMonths} mo in FY · {fmt(d.billed)} billed co-term</div></td>
                    <td className="num">{fmtK(d.seats)}</td>
                    <td>{d.close}</td>
                    <td><DealLinks d={d} /></td>
                  </tr>
                  <tr className="deal-comment"><td colSpan="6"><span className="cmt-lbl">CRM</span>{d.comment}</td></tr>
                </React.Fragment>
              ))}
              <tr className="deal-total">
                <td className="deal-name">Total open forecast</td><td></td>
                <td className="num">{fmt(fcAll)}</td>
                <td className="num">{fmtK(seatsHiPo + seatsUpside)}</td>
                <td colSpan="2"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div className="section-title">Where the Hours Go <span className="hint">meeting time by account, last 60 days</span></div>
        <div className="hours">
          {hours.map((h, i) => (
            <div className="hbar-row" key={i}>
              <div className="hbar-name">{h.name}</div>
              <div className="hbar-track"><div className="hbar-fill" style={{ width: Math.max(8, (h.n / maxHours) * 100) + '%' }}>{h.n}</div></div>
            </div>
          ))}
        </div>

        <div className="foot">
          Internal Microsoft GTM. Pipeline, seats, and forecast comments from MSX. Weighted attainment and bucket weights from MSX Earnings (AI Workforce 40%, Copilot + Agents 30%, Copilot + Agent Usage 15%, Virtualization 15%). Usage held at 120% and Virtualization at 100% as Sean's assumptions (not patch focus). All-up DBF by quarter is with E7 security and foots to the FY. MSXi Reported excludes the E7 security attach. FY27 forecast is in-fiscal-year billed revenue; anniversaries landing next fiscal (MSC, Smiths at July 1) count only co-term months. Rows marked ⚑ have inferred fiscal timing to confirm. Not for external distribution.
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
